[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "longdur_ett"
version = "1.0.0"
license = "MIT"
description = "Long-Duration Time Series Forecasting on the ETT Dataset"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "torch",
    "scikit-learn",
    "ipykernel",
    "pmdarima"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*"]
